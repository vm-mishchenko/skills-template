[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

# Every entry point below becomes a global command.
# Format: command-name = "package.module:function"
[project.scripts]
skills = "skills_cli.cli:main"
agent = "agent_cli.cli:main"
example = "example_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
